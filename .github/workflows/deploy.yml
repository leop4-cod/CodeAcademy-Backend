name: 🚀 Deploy to DigitalOcean VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecutarlo manualmente desde GitHub

jobs:
  deploy:
    name: 🚀 Deploy CodeAcademy Backend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Desplegar al VPS via SSH
      - name: 🔐 SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 180s
          command_timeout: 160s
          script: |
            set -e

            PROJECT_DIR="/opt/codeacademy/CodeAcademy_bakend"
            VENV_DIR="$PROJECT_DIR/venv"

            echo "======================================"
            echo "  DESPLIEGUE AUTOMATICO - $(date)"
            echo "======================================"

            # Actualizar codigo desde GitHub
            cd $PROJECT_DIR
            git fetch --all
            git reset --hard origin/main
            echo "[OK] Codigo actualizado"

            # Instalar dependencias nuevas si las hay
            $VENV_DIR/bin/pip install -q --upgrade pip
            $VENV_DIR/bin/pip install -q -r requirements.txt
            echo "[OK] Dependencias actualizadas"

            # Migraciones de base de datos
            $VENV_DIR/bin/python manage.py migrate --noinput
            echo "[OK] Migraciones aplicadas"

            # Archivos estaticos
            $VENV_DIR/bin/python manage.py collectstatic --noinput --clear
            echo "[OK] Archivos estaticos recopilados"

            # Reiniciar Gunicorn
            systemctl restart gunicorn
            sleep 2
            systemctl is-active --quiet gunicorn && echo "[OK] Gunicorn activo" || exit 1

            # Verificar Nginx
            systemctl is-active --quiet nginx && echo "[OK] Nginx activo" || exit 1

            # Test final de la API
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/)
            echo "[OK] API responde HTTP $HTTP_CODE"

            echo "======================================"
            echo "  DESPLIEGUE COMPLETADO"
            echo "  http://codeacademy-api.uaeftt-ute.site"
            echo "======================================"
